name: Live Fast.com API Smoke Test

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  live-api:
    name: Live fast.com speedtest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run live Fast.com smoke tests
        run: uv run pytest -m real_api_call --no-cov
